<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 星空抽籤系統 - 奕鈞老師專屬</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Phosphor Icons for UI Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* 磨砂玻璃特效 (Glassmorphism) */
        .glass-panel {
            background: rgba(20, 20, 35, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        /* 抽籤結果文字光暈 */
        .text-glow {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(138, 43, 226, 0.6);
        }
        
        /* 抽中時的動畫 */
        .winner-anim {
            animation: winnerPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.4);
        }
        
        @keyframes winnerPop {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 1; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* 隱藏捲軸但可滾動 */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2); 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3); 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5); 
        }
    </style>
</head>
<body class="m-0 overflow-hidden bg-black text-white font-sans selection:bg-purple-600">

    <!-- 3D 畫布容器 -->
    <div id="canvas-container" class="fixed inset-0 z-0"></div>

    <!-- 主介面 -->
    <main class="relative z-10 flex flex-col items-center justify-center min-h-screen p-4 pointer-events-none">
        
        <!-- 設定按鈕 (右上角) -->
        <div class="absolute top-6 right-6 pointer-events-auto">
            <button onclick="openSettings()" class="glass-panel p-3 rounded-full hover:bg-white/10 transition-all duration-300 group">
                <i class="ph ph-gear text-2xl text-gray-300 group-hover:text-white group-hover:rotate-90 transition-transform duration-500"></i>
            </button>
        </div>

        <!-- 標題 -->
        <h1 class="absolute top-8 left-8 text-2xl font-light tracking-widest text-gray-300 pointer-events-auto hidden sm:block">
            星空抽籤 <span class="text-purple-400 font-medium">PRO</span>
        </h1>

        <!-- 抽籤顯示區 -->
        <div class="glass-panel rounded-3xl p-10 w-full max-w-2xl text-center pointer-events-auto transform transition-transform duration-300 hover:scale-[1.02]">
            <p id="statusText" class="text-purple-300 text-sm tracking-[0.3em] mb-6 uppercase">等待抽籤</p>
            
            <div class="h-32 flex items-center justify-center mb-8">
                <h2 id="resultDisplay" class="text-5xl sm:text-7xl font-bold text-glow truncate w-full px-4">
                    準備開始
                </h2>
            </div>
            
            <button id="drawBtn" onclick="startDraw()" class="bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-4 px-12 rounded-full text-xl shadow-[0_0_20px_rgba(138,43,226,0.4)] hover:shadow-[0_0_30px_rgba(138,43,226,0.7)] transition-all duration-300 active:scale-95">
                開始抽籤
            </button>
        </div>
    </main>

    <!-- 設定名單 Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-panel rounded-2xl w-full max-w-lg p-6 sm:p-8 transform scale-95 transition-transform duration-300" id="modalContent">
            
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold flex items-center gap-2">
                    <i class="ph ph-list-numbers text-purple-400"></i> 設定抽籤名單
                </h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white transition-colors">
                    <i class="ph ph-x text-2xl"></i>
                </button>
            </div>
            
            <p class="text-gray-300 text-sm mb-3">請輸入名單，<span class="text-purple-300 font-bold">一行代表一個選項</span>：</p>
            
            <textarea id="namesInput" class="w-full h-64 bg-black/40 border border-gray-600 rounded-xl p-4 text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all resize-none leading-relaxed" placeholder="例如：&#10;奕鈞老師&#10;第一組&#10;第二組..."></textarea>
            
            <div class="flex justify-between items-center mt-6">
                <span id="listCount" class="text-sm text-gray-400 font-mono">載入中...</span>
                <div class="space-x-3">
                    <button onclick="closeSettings()" class="px-5 py-2 rounded-lg text-gray-300 hover:bg-white/10 transition-colors">取消</button>
                    <button onclick="saveNames()" class="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg shadow-lg transition-colors font-medium">儲存名單</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           1. Three.js 3D 星空背景設定
           ========================================= */
        const initStarrySky = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            
            // 攝影機設定
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 800;

            // 渲染器設定
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 建立星星粒子系統 (分為兩層製造層次感)
            const createStars = (count, size, color) => {
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                for (let i = 0; i < count; i++) {
                    const x = (Math.random() - 0.5) * 2000;
                    const y = (Math.random() - 0.5) * 2000;
                    const z = (Math.random() - 0.5) * 2000;
                    vertices.push(x, y, z);
                }
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                const material = new THREE.PointsMaterial({
                    color: color,
                    size: size,
                    transparent: true,
                    opacity: 0.8,
                    sizeAttenuation: true
                });
                return new THREE.Points(geometry, material);
            };

            // 第一層：細小白星
            const stars1 = createStars(3000, 1.5, 0xffffff);
            scene.add(stars1);

            // 第二層：稍微大一點的紫色/藍色星
            const stars2 = createStars(1000, 2.5, 0xddaaff);
            scene.add(stars2);

            // 動畫迴圈
            const animate = () => {
                requestAnimationFrame(animate);
                
                // 緩慢旋轉星空
                stars1.rotation.y += 0.0005;
                stars1.rotation.x += 0.0002;
                
                stars2.rotation.y -= 0.0003;
                stars2.rotation.z += 0.0002;

                renderer.render(scene, camera);
            };
            animate();

            // 響應式：視窗大小改變時更新畫布
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        // 啟動 3D 背景
        window.onload = initStarrySky;


        /* =========================================
           2. 抽籤邏輯與介面互動
           ========================================= */
        
        // 預設名單 (給奕鈞老師的預設範例)
        const defaultNames = "奕鈞老師\n第一組\n第二組\n第三組\n第四組\n第五組\n第六組";
        let namesList = [];
        let isDrawing = false;

        // 初始化名單
        const initNames = () => {
            const saved = localStorage.getItem('starryDrawNames');
            const initialData = saved !== null ? saved : defaultNames;
            document.getElementById('namesInput').value = initialData;
            parseNames(initialData);
        };

        // 解析字串為陣列
        const parseNames = (str) => {
            namesList = str.split('\n')
                           .map(n => n.trim())
                           .filter(n => n.length > 0);
            document.getElementById('listCount').innerText = `共 ${namesList.length} 個選項`;
        };

        // 儲存名單到瀏覽器
        const saveNames = () => {
            const inputStr = document.getElementById('namesInput').value;
            parseNames(inputStr);
            if (namesList.length === 0) {
                alert("名單不能為空喔！請輸入至少一個選項。");
                return;
            }
            localStorage.setItem('starryDrawNames', inputStr);
            closeSettings();
            
            // 重置顯示區
            const resultDisplay = document.getElementById('resultDisplay');
            resultDisplay.innerText = "準備開始";
            resultDisplay.classList.remove('winner-anim');
            document.getElementById('statusText').innerText = "名單已更新";
        };

        // 開關設定 Modal
        const modal = document.getElementById('settingsModal');
        const modalContent = document.getElementById('modalContent');
        
        const openSettings = () => {
            if (isDrawing) return;
            document.getElementById('namesInput').value = namesList.join('\n');
            
            modal.classList.remove('hidden');
            // 觸發重繪以播放過渡動畫
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        };

        const closeSettings = () => {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // 對應 Tailwind 的 duration-300
        };

        // 點擊 Modal 背景關閉
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeSettings();
        });

        // 抽籤主程式 (包含洗牌動畫)
        const startDraw = () => {
            if (isDrawing) return;
            if (namesList.length === 0) {
                openSettings();
                return;
            }

            isDrawing = true;
            const drawBtn = document.getElementById('drawBtn');
            const resultDisplay = document.getElementById('resultDisplay');
            const statusText = document.getElementById('statusText');
            
            // UI 狀態切換
            drawBtn.innerHTML = '<i class="ph ph-spinner-gap animate-spin text-2xl"></i>';
            drawBtn.classList.add('opacity-80', 'cursor-not-allowed');
            resultDisplay.classList.remove('winner-anim');
            statusText.innerText = "系統演算中...";

            // 動畫參數
            let speed = 40;        // 初始跳動速度 (毫秒)
            const duration = 3500; // 總抽籤時間 3.5秒
            let elapsed = 0;

            const shuffle = () => {
                // 隨機顯示名字
                const randomIndex = Math.floor(Math.random() * namesList.length);
                resultDisplay.innerText = namesList[randomIndex];

                elapsed += speed;
                
                // 模擬物理減速效果 (Slot machine 效果)
                if (elapsed < duration) {
                    if (elapsed > duration * 0.6) {
                        speed += 25; // 後期急遽減速
                    } else if (elapsed > duration * 0.4) {
                        speed += 10;
                    }
                    setTimeout(shuffle, speed);
                } else {
                    // 抽出最終結果
                    finishDraw();
                }
            };

            const finishDraw = () => {
                const finalIndex = Math.floor(Math.random() * namesList.length);
                const winner = namesList[finalIndex];
                
                resultDisplay.innerText = winner;
                resultDisplay.classList.add('winner-anim'); // 觸發放大與變色動畫
                statusText.innerText = "⭐ 抽籤結果 ⭐";

                // 恢復按鈕狀態
                isDrawing = false;
                drawBtn.innerHTML = '重新抽籤';
                drawBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            };

            shuffle();
        };

        // 執行初始化
        initNames();

    </script>
</body>
</html>
